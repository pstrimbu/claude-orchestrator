<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>orch3</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="collapsed">
  <!-- Collapsed: two dot strips side by side -->
  <div id="collapsed-view">
    <div id="dot-strips">
      <div id="dot-strip"></div>
      <div id="dot-strip-portals"></div>
    </div>
  </div>

  <!-- Expanded: full view with tabs -->
  <div id="expanded-view">
    <div id="titlebar">
      <span class="title">orch3</span>
      <div class="titlebar-actions">
        <button id="cascade-btn" title="Cascade windows">&#9638;</button>
        <button id="add-btn" title="Add project">+</button>
      </div>
    </div>
    <div id="tab-bar">
      <button class="tab active" data-tab="projects">Sessions</button>
      <button class="tab" data-tab="portals">Portals</button>
    </div>
    <div id="tab-content">
      <div id="project-list" class="tab-panel active"></div>
      <div id="portal-list" class="tab-panel"></div>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
